<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOOCAP Production OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070b;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.028);
    --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.14);
    --txt:#f3f5fa;--muted:#9aa4b6;--faint:#646c7d;
    --p0:#ff5860;--p1:#ff9838;--p2:#5b93ff;--p3:#818b9c;
    --ok:#2fd39a;--warn:#ffc65a;--bad:#ff5860;--accent:#5b8cff;
    --grad:linear-gradient(135deg,#5b8cff 0%,#8b5cff 55%,#2ec38b 130%);
    --shadow:0 2px 6px rgba(0,0,0,.35),0 18px 50px rgba(0,0,0,.5);--r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(760px 460px at 82% -8%,rgba(91,140,255,.2),transparent 60%),radial-gradient(680px 420px at 8% 4%,rgba(139,92,255,.16),transparent 58%),radial-gradient(720px 560px at 60% 108%,rgba(46,195,139,.13),transparent 60%)}
  .wrap{max-width:1200px;margin:0 auto;padding:22px}.hide{display:none!important}
  #gate{min-height:100vh;display:grid;place-items:center;padding:26px 18px}
  .logincard{width:100%;max-width:390px;background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:24px;padding:36px 30px;box-shadow:var(--shadow);text-align:center}
  .lock{width:60px;height:60px;border-radius:18px;margin:0 auto 20px;background:var(--grad);display:grid;place-items:center;font-size:26px;box-shadow:0 12px 34px rgba(91,140,255,.4)}
  .logincard h1{font-size:22px;margin:0 0 6px;letter-spacing:-.4px;font-weight:800}
  .logincard .sub{color:var(--muted);margin:0 0 26px;font-size:13.5px}
  .code{display:flex;gap:8px;justify-content:center}
  .code input{width:46px;height:56px;text-align:center;font-size:22px;font-weight:800;color:var(--txt);background:var(--glass2);border:1px solid var(--line);border-radius:13px;outline:none;transition:.15s;font-family:inherit}
  .code input:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.22);background:rgba(91,140,255,.06)}
  .err{color:var(--bad);font-size:12.5px;height:18px;margin:8px 0 0;opacity:0;transition:.2s}.err.show{opacity:1}
  .shake{animation:shake .38s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:6px 0 20px;margin-bottom:22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#fff;font-size:17px}
  .brand h1{font-size:15px;margin:0;font-weight:800}.brand p{margin:0;color:var(--muted);font-size:12px}
  .whoami{display:flex;align-items:center;gap:11px}.whoami .meta{text-align:right}.whoami .meta .n{font-weight:700;font-size:13px}.whoami .meta .r{font-size:11.5px;color:var(--muted)}
  .switch{background:var(--glass);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:600;font-size:12.5px;font-family:inherit}
  .switch:hover{color:var(--txt);border-color:var(--line2)}
  .greet{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
  .greetsub{color:var(--muted);margin:0 0 22px;font-size:13.5px;max-width:820px}
  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:22px}
  .tile{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:visible}
  .tile::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--line2);opacity:.6;border-radius:var(--r) var(--r) 0 0}
  .tile.red::after{background:var(--bad)}.tile.amber::after{background:var(--warn)}.tile.blue::after{background:var(--p2)}.tile.green::after{background:var(--ok)}
  .tile .n{font-size:29px;font-weight:900;letter-spacing:-1.5px;line-height:1}.tile .l{font-size:12px;color:var(--muted);margin-top:6px}
  .tile.red .n{color:var(--bad)}.tile.amber .n{color:var(--warn)}.tile.green .n{color:var(--ok)}
  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .grid2>div{min-width:0}
  .voicebtns{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
  .vbtn{background:var(--glass2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
  .vbtn:hover{border-color:rgba(139,92,255,.5)}
  .vbtn.on{background:rgba(139,92,255,.2);border-color:rgba(139,92,255,.6);color:#d7c4ff}
  .briefbox{width:100%;box-sizing:border-box;min-height:96px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:13.5px;line-height:1.5;padding:12px 13px;outline:none}
  .briefbox:focus{border-color:rgba(139,92,255,.5)}
  .voicebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:11px 0 4px;flex-wrap:wrap}
  .vfmts{display:flex;gap:8px}
  .vfmt{background:var(--glass2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .vfmt.on{background:rgba(46,195,139,.14);border-color:rgba(46,195,139,.4);color:#aef3d8}
  .bigbtn{font-size:13.5px;padding:9px 18px}
  .scriptout{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-top:12px;font-size:13.5px;line-height:1.6;color:var(--txt)}
  .scriptout.hint,.scriptout.busy{color:var(--muted);font-style:normal}
  .scriptout.err{color:#ff9297;border-color:rgba(255,88,96,.4)}
  .scriptout-bar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
  .scwacts{display:flex;gap:6px;margin-top:9px}
  .scwbox{margin-top:9px}
  .kcard[draggable="true"]{cursor:grab}.kcard[draggable="true"]:active{cursor:grabbing}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .addinput{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--txt);font-family:inherit;font-size:13px;padding:8px 11px;outline:none}
  .addinput:focus{border-color:rgba(139,92,255,.5)}
  .esel2{background:var(--glass2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;outline:none}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:visible;margin-bottom:16px;min-width:0}
  .card h3{margin:0;padding:15px 17px;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:700;border-radius:var(--r) var(--r) 0 0}
  .card h3 .ic{display:flex;align-items:center;gap:10px}.card h3 .sq{width:26px;height:26px;border-radius:8px;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
  .card h3 .sub{color:var(--muted);font-weight:500;font-size:12px}.card .body{padding:8px 13px 13px}
  .empty{color:var(--faint);text-align:center;padding:24px 10px;font-size:13px}
  .row{display:flex;align-items:center;gap:11px;padding:11px 9px;border-radius:11px}.row:hover{background:var(--glass2)}.row+.row{border-top:1px solid var(--line)}
  .pri{font-size:10px;font-weight:800;padding:4px 8px;border-radius:7px;letter-spacing:.4px;flex:0 0 auto}
  .P0{background:rgba(255,88,96,.16);color:#ff9297}.P1{background:rgba(255,152,56,.16);color:#ffbb7e}.P2{background:rgba(91,147,255,.16);color:#9dbcff}.P3{background:rgba(129,139,156,.2);color:#c2c9d5}
  .row .title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .meta{color:var(--muted);font-size:12px;flex:0 0 auto}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--glass2);color:var(--muted);flex:0 0 auto;border:1px solid var(--line)}
  .badge.red{color:#ff9297;border-color:rgba(255,88,96,.42)}.badge.amber{color:#ffcf7a;border-color:rgba(255,198,90,.42)}
  .eff{font-size:10px;font-weight:800;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
  .clientchip{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(139,92,255,.14);color:#c7b3ff;border:1px solid rgba(139,92,255,.3);flex:0 0 auto}
  .cap{display:flex;align-items:center;gap:12px;padding:11px 8px}.cap .name{width:92px;font-weight:600;flex:0 0 auto;display:flex;align-items:center;gap:8px}
  .mini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#08090d;flex:0 0 auto}
  .cap .track{flex:1;height:20px;border-radius:10px;background:var(--glass2);overflow:hidden;border:1px solid var(--line)}
  .cap .fill{height:100%;border-radius:10px 0 0 10px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .cap .val{width:58px;text-align:right;color:var(--muted);font-size:12px;flex:0 0 auto;font-weight:600}
  .lf{padding:13px 8px;border-top:1px solid var(--line)}.lf:first-child{border-top:none}
  .lf .top{display:flex;justify-content:space-between;margin-bottom:9px}.lf .name{font-weight:600}.lf .stage{color:var(--muted);font-size:12px}
  .steps{display:flex;gap:5px}.step{flex:1;height:8px;border-radius:4px;background:var(--glass2)}.step.done{background:var(--ok)}.step.now{background:var(--p2)}
  .kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);gap:13px;overflow-x:auto;padding-bottom:12px}
  .col{background:var(--glass);border:1px solid var(--line);border-radius:15px;min-height:150px}
  .col h4{margin:0;padding:13px 14px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .col h4 .cnt{background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px}
  .col .stack{padding:11px;display:flex;flex-direction:column;gap:11px}
  .kcard{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:12px}.kcard .kt{font-weight:600;font-size:12.5px;margin:8px 0;line-height:1.35}
  .kcard .kmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.kcard .who{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:5px}
  .wait{font-size:10px;color:#ffcf7a}.od{color:#ff9297}.unassigned{outline:1px dashed rgba(255,198,90,.5)}
  .editor-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.colnote{font-size:10.5px;color:var(--faint);padding:0 14px 10px;margin-top:-2px}
  .note{color:var(--faint);font-size:12px;margin:15px 2px 0}
  .filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .flabel{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-right:2px;font-weight:800}
  .fchip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--glass2);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
  .fchip:hover{border-color:var(--line2);color:var(--txt)}.fchip.on{background:rgba(91,140,255,.18);border-color:rgba(91,140,255,.55);color:#bcd0ff}
  .fsep{width:1px;height:20px;background:var(--line);margin:0 5px}
  .searchbox{flex:1;min-width:150px;display:flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:6px 13px}
  .searchbox input{background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:12.5px;width:100%}
  .stagebar{display:flex;flex-wrap:wrap;gap:9px}.stagepill{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
  .stagepill b{font-size:18px;font-weight:800;letter-spacing:-.5px}.stagepill span{color:var(--muted);font-size:12px}
  .morelink{color:#9dbcff;font-size:12px;font-weight:600;padding:10px 9px 4px}
  .agebadge{font-size:10px;color:#ff9297;font-weight:800;flex:0 0 auto}
  .plainbox{background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.3);border-radius:14px;padding:14px 17px;margin-bottom:18px;font-size:14.5px;color:var(--txt);line-height:1.6}.plainbox b{font-weight:800}
  .motive{display:flex;align-items:center;gap:12px;margin:2px 0 20px;padding:13px 16px;border-radius:14px;background:linear-gradient(120deg,rgba(91,140,255,.16),rgba(139,92,255,.14) 60%,rgba(46,195,139,.12));border:1px solid rgba(139,92,255,.32)}
  .motive .spark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .motive .mtext{font-size:13.5px;font-weight:600;color:var(--txt);line-height:1.45}
  .keybox{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-top:18px;font-size:12.5px;color:var(--muted);line-height:2}.keybox b{color:var(--txt)}.keybox .k{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
  .info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:10px;font-weight:800;cursor:help;position:relative;flex:0 0 auto;font-style:italic;font-family:Georgia,serif}
  .info:hover{color:#fff;border-color:var(--accent);background:var(--accent)}
  .info:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);right:-6px;width:210px;background:#0c0f15;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font:500 11.5px/1.55 "Inter",sans-serif;color:var(--txt);box-shadow:var(--shadow);z-index:80;text-align:left}
  .info:hover::before{content:"";position:absolute;bottom:calc(100% + 4px);right:2px;border:5px solid transparent;border-top-color:var(--line2);z-index:80}
  .tileinfo{position:absolute;top:11px;right:12px}
  .assignbtn{background:rgba(46,195,139,.16);border:1px solid rgba(46,195,139,.42);color:#7fe6c0;border-radius:8px;padding:5px 11px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .assignbtn:hover{background:rgba(46,195,139,.3)}.assignbtn:disabled{opacity:.5;cursor:default}
  .esel{background:rgba(46,195,139,.14);border:1px solid rgba(46,195,139,.4);color:#aef3d8;border-radius:8px;padding:5px 9px;font-size:11px;font-family:inherit;font-weight:700;cursor:pointer;max-width:170px;outline:none}
  .esel:hover{background:rgba(46,195,139,.24)}.esel option{background:#11141b;color:var(--txt);font-weight:600}
  .asset{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--glass2);border:1px solid var(--line2);color:var(--muted);text-decoration:none}
  .asset:hover{color:var(--txt);border-color:var(--accent)}
  .act{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--glass2);border:1px solid var(--line2);color:var(--muted);cursor:pointer;font-family:inherit}
  .act:disabled{opacity:.5;cursor:default}
  .act.warn{border-color:rgba(255,120,120,.5);color:#ffb4b4}.act.warn:hover:not(:disabled){background:rgba(255,90,90,.14)}
  .act.go{border-color:rgba(90,220,150,.5);color:#8fe9bd}.act.go:hover:not(:disabled){background:rgba(70,220,150,.14)}
  .del{font-size:12px;padding:4px 8px;border-radius:8px;background:transparent;border:1px solid var(--line2);color:var(--faint);cursor:pointer;font-family:inherit;flex:0 0 auto;transition:.13s}
  .del:hover:not(:disabled){color:#ff9297;border-color:rgba(255,88,96,.5);background:rgba(255,88,96,.1)}
  .del:disabled{opacity:.5;cursor:default}
  .fmt{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.3px;flex:0 0 auto}
  .fmt.lf{background:rgba(139,92,255,.16);color:#c7b3ff;border:1px solid rgba(139,92,255,.35)}
  .fmt.sf{background:rgba(56,200,214,.14);color:#8fe0ea;border:1px solid rgba(56,200,214,.32)}
  .sparkbars{display:inline-flex;align-items:flex-end;gap:2px;height:18px;margin-left:9px;vertical-align:-4px}
  .sparkbars i{width:4px;min-height:3px;background:rgba(46,195,139,.7);border-radius:1px}
  .up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}.flat{color:var(--faint);font-weight:800}
  .sc{padding:10px 8px;border-bottom:1px solid var(--line)}.sc:last-child{border-bottom:none}
  .sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .sc-top .name{display:flex;align-items:center;gap:8px;font-weight:600}
  .sc-load{font-size:12px;color:var(--muted);font-weight:700}.sc-load.od{color:#ff9297}
  .sc .track{height:8px;border-radius:6px;background:var(--glass2);overflow:hidden;border:1px solid var(--line)}
  .sc .fill{height:100%;border-radius:6px}
  .sc-meta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
  .sc-meta .bad{color:#ff9297;font-weight:700}
  .bnchip{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:rgba(255,88,96,.16);color:#ff9297;border:1px solid rgba(255,88,96,.4);letter-spacing:.3px;vertical-align:1px}
  .funnel{display:flex;align-items:stretch;gap:6px;margin-bottom:18px;overflow-x:auto}
  .fstep{flex:1;min-width:92px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.13s}
  .fstep:hover{border-color:var(--line2);transform:translateY(-2px)}
  .fstep.active{border-color:rgba(91,140,255,.75);box-shadow:0 0 0 2px rgba(91,140,255,.28)}
  .fstep.bn{border-color:rgba(255,152,56,.6)}
  .fstep .fn{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .fstep .fl{font-size:10.5px;color:var(--muted);margin-top:4px}
  .farr{align-self:center;color:var(--faint);font-size:15px;flex:0 0 auto}
  .chealth{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-bottom:18px}
  .ccard{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer}.ccard:hover{border-color:var(--line2)}.ccard.bad{border-color:rgba(255,88,96,.45)}
  .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.cc-total{font-size:19px;font-weight:800}.cc-row{display:flex;gap:13px;font-size:11.5px;color:var(--muted)}
  .loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.editor-cols{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}

  /* ===== ANIMATION LAYER (mirrored from preview) =========================== */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tile,.card,.col{animation:rise .5s both}

  /* 1 — drifting background blobs */
  .bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bgfx span{position:absolute;border-radius:50%;filter:blur(80px);opacity:.34;will-change:transform}
  .bgfx span:nth-child(1){width:540px;height:540px;top:-150px;left:-90px;
    background:radial-gradient(circle,rgba(91,140,255,.55),transparent 70%);animation:drift1 30s ease-in-out infinite}
  .bgfx span:nth-child(2){width:480px;height:480px;top:14%;right:-120px;
    background:radial-gradient(circle,rgba(139,92,255,.5),transparent 70%);animation:drift2 34s ease-in-out infinite}
  .bgfx span:nth-child(3){width:600px;height:600px;bottom:-220px;left:38%;
    background:radial-gradient(circle,rgba(46,195,139,.4),transparent 70%);animation:drift3 40s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,40px) scale(1.08)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-60px) scale(1.14)}}

  /* 2 — hover lift + press feedback */
  .tile{transition:transform .2s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .2s}
  .tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 12px 36px rgba(0,0,0,.5)}
  .tile[onclick]{cursor:pointer}
  .tile.active{border-color:rgba(91,140,255,.75)!important;box-shadow:0 0 0 2px rgba(91,140,255,.28),0 12px 36px rgba(0,0,0,.5)}
  .card{transition:border-color .2s,box-shadow .2s}
  .card:hover{border-color:var(--line2)}
  .stagepill{transition:transform .18s,border-color .18s}.stagepill:hover{transform:translateY(-2px);border-color:var(--line2)}
  .switch,.assignbtn,.esel,.asset,.act,.fchip{transition:transform .13s,background .15s,border-color .15s,color .15s}
  .switch:active,.assignbtn:active,.esel:active,.asset:active,.act:active,.fchip:active,.ccard:active,.tile:active{transform:scale(.96)}
  .num-anim{font-variant-numeric:tabular-nums}

  /* 3 — staggered entrance for columns, cards, capacity bars */
  .kanban .col,.editor-cols .col{animation:rise .5s both}
  .kanban .col:nth-child(2),.editor-cols .col:nth-child(2){animation-delay:.06s}
  .kanban .col:nth-child(3),.editor-cols .col:nth-child(3){animation-delay:.12s}
  .kanban .col:nth-child(4),.editor-cols .col:nth-child(4){animation-delay:.18s}
  .kanban .col:nth-child(5),.editor-cols .col:nth-child(5){animation-delay:.24s}
  .kanban .col:nth-child(6){animation-delay:.3s}
  .grid2>div:nth-child(2) .card{animation-delay:.1s}
  .cap{animation:rise .45s both}
  .cap:nth-child(2){animation-delay:.05s}.cap:nth-child(3){animation-delay:.1s}.cap:nth-child(4){animation-delay:.15s}.cap:nth-child(5){animation-delay:.2s}
  .chealth .ccard{animation:rise .45s both}
  .chealth .ccard:nth-child(2){animation-delay:.04s}.chealth .ccard:nth-child(3){animation-delay:.08s}.chealth .ccard:nth-child(4){animation-delay:.12s}
  .chealth .ccard:nth-child(5){animation-delay:.16s}.chealth .ccard:nth-child(6){animation-delay:.2s}.chealth .ccard:nth-child(7){animation-delay:.24s}
  .kcard{animation:pop .34s both}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

  /* 4 — loading skeleton shimmer */
  .sk{background:linear-gradient(90deg,var(--glass2) 25%,rgba(255,255,255,.07) 37%,var(--glass2) 63%);
    background-size:400% 100%;animation:shimmer 1.25s ease infinite;border-radius:12px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin:14px 0 22px}
  .sk-tile{height:86px;border-radius:var(--r)}
  .sk-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
  .sk-card{height:210px;border-radius:var(--r)}.sk-line{height:16px;border-radius:8px;margin:0 0 12px}
  .sk-greet{height:26px;width:320px;border-radius:9px;margin:2px 0 6px}.sk-sub{height:14px;width:min(560px,80%);border-radius:8px;margin:0 0 20px}
  @media(max-width:900px){.sk-tiles{grid-template-columns:repeat(3,1fr)}.sk-grid{grid-template-columns:1fr}}

  /* spinner (offline / retry states) */
  .spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);border-top-color:#5b8cff;display:inline-block;animation:spin .8s linear infinite;vertical-align:-4px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .bgfx span{animation:none}
  }
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><span></span><span></span><span></span></div>
<div id="gate">
  <div class="logincard" id="logincard">
    <div class="lock">🔐</div><h1>NOOCAP Production OS</h1>
    <p class="sub">Enter your 4-digit access code</p>
    <div class="code" id="codeInputs">
      <input maxlength="1" inputmode="numeric"/><input maxlength="1" inputmode="numeric"/>
      <input maxlength="1" inputmode="numeric"/><input maxlength="1" inputmode="numeric"/>
    </div>
    <p class="err" id="err">That code doesn't match anyone.</p>
  </div>
</div>
<div id="app" class="wrap hide">
  <header>
    <div class="brand"><div class="logo">N</div><div><h1>NOOCAP Production OS</h1><p id="today">—</p></div></div>
    <div class="whoami"><div class="meta"><div class="n" id="hName">—</div><div class="r" id="hRole">—</div></div>
      <div class="mini" id="hAvatar" style="width:38px;height:38px;font-size:14px">—</div>
      <button class="switch" onclick="logout()">Sign out</button></div>
  </header>
  <div id="motive"></div>
  <div id="dash"><div class="loading">Loading your dashboard…</div></div>
</div>
<script>
// ===== config =====
const EDITORS=["PARVEZ","VICKY","SUMITH","ABHISHEK","PRABAL"];
const EFFPTS={S:0.5,M:0.5,L:2}, CAP=2, ACTIVE=["Scripting","Ready to Edit","Editing","Review"];
const STAGES=["Intake","Scripting","Ready to Edit","Editing","Review","Ready to Post"];
const order={P0:0,P1:1,P2:2,P3:3};
const PRI={P0:"URGENT",P1:"SOON",P2:"NORMAL",P3:"LATER"};
const FORM_URL="https://noocap.notion.site/e477c4080dbe4083bc21f505cc706095";
const DISCORD_SERVER_ID="1406306400006705162";
const threadUrl=t=>t&&t.threadId?`https://discord.com/channels/${DISCORD_SERVER_ID}/${t.threadId}`:null;
// Frame.io links are stored as plain URLs; make sure whatever we get opens as an
// absolute link (prefix https:// if a bare value ever sneaks in) and is trimmed.
const safeUrl=u=>{u=(u||"").trim();if(!u)return null;return /^https?:\/\//i.test(u)?u:"https://"+u;};
const STAGEL={"Intake":"New idea","Scripting":"Writing script","Ready to Edit":"Ready to edit","Editing":"Editing","Review":"Checking","Ready to Post":"Ready to post"};
const PALETTE=["#5b8cff","#2ec38b","#ff9838","#c879ff","#ff5860","#38c8d6","#ffc65a","#8b93ff"];
const prettify=n=>n?n[0].toUpperCase()+n.slice(1).toLowerCase():n;
const initials=n=>(n||"?").slice(0,2).toUpperCase();
const colorFor=n=>PALETTE[[...(n||"?")].reduce((s,c)=>s+c.charCodeAt(0),0)%PALETTE.length];
const mini=(n,s=22)=>`<span class="mini" style="width:${s}px;height:${s}px;background:${colorFor(n)}">${initials(n)}</span>`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let CURRENT=null, TASKS=[], INTAKEX=[], INTAKEALL=[];
const loadFor=n=>TASKS.filter(t=>t.owner===n&&ACTIVE.includes(t.stage)).reduce((s,t)=>s+(EFFPTS[t.effort]||0.5),0);
function dueInfo(t){
  if(!t.postDate)return{label:t.stage==="Intake"?"no date":"—",cls:""};
  const d=new Date(t.postDate+"T00:00:00"),diff=Math.round((d-TODAY)/864e5),lab=MO[d.getMonth()]+" "+d.getDate();
  if(t.stage==="Published")return{label:"Posted "+lab};
  if(t.stage==="Ready to Post"&&diff<0)return{label:"Overdue "+lab,cls:"od",stuck:true};
  if(diff<0)return{label:"Late "+lab,cls:"od",overdue:true};
  if(diff===0)return{label:"Post today",cls:"od",today:true};
  if(diff<=3)return{label:"Post "+lab,soon:true};
  return{label:"Post "+lab};
}
// ===== API =====
async function apiTasks(fresh){const r=await fetch("/api/tasks"+(fresh?"?fresh=1":""));if(r.status===401)return null;if(!r.ok)throw new Error((await r.json()).error);return r.json();}
async function apiLogin(code){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})});return r.ok?r.json():null;}
async function apiUpdate(p){const r=await fetch("/api/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});if(!r.ok)alert("Couldn't save: "+((await r.json()).error||r.status));return r.ok;}
// ===== login flow =====
const inputs=[...document.querySelectorAll("#codeInputs input")];
inputs.forEach((el,i)=>{
  el.addEventListener("input",()=>{el.value=el.value.replace(/[^0-9]/g,"");if(el.value&&i<3)inputs[i+1].focus();if(inputs.every(x=>x.value))submitCode();});
  el.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!el.value&&i>0)inputs[i-1].focus();});
});
async function submitCode(){
  const code=inputs.map(x=>x.value).join("");
  const u=await apiLogin(code);
  if(u){await boot();}
  else{const e=document.getElementById("err"),k=document.getElementById("logincard");e.classList.add("show");k.classList.add("shake");
    setTimeout(()=>k.classList.remove("shake"),400);setTimeout(()=>{inputs.forEach(x=>x.value="");inputs[0].focus();},450);}
}
function logout(){fetch("/api/logout",{method:"POST"}).then(()=>{CURRENT=null;document.getElementById("motive").innerHTML="";document.getElementById("app").classList.add("hide");document.getElementById("gate").classList.remove("hide");inputs.forEach(x=>x.value="");inputs[0].focus();});}
// A fresh line of encouragement each time someone signs in, tuned to their role.
const MOTIVES={
  COO:[
    "The systems you tighten today are what let the team ship without you tomorrow.",
    "Every bottleneck you clear this morning compounds across every client by Friday.",
    "You set the pace for the whole floor, so start with the decision everyone's waiting on.",
    "Growth lives in the boring habits you protect, so guard the pipeline before the fires start.",
    "The numbers follow the standard you hold, so raise the bar on one thing today.",
  ],
  Ops:[
    "Every video you unblock now is one an editor can finish before lunch.",
    "You keep the whole floor moving, so start with whoever's been waiting longest.",
    "A clean board by noon means nobody's guessing what to work on this afternoon.",
    "The faster you route the next handoff, the sooner three people get to do their best work.",
    "Chase the oldest blocker first and the rest of the day stops chasing you.",
  ],
  Scriptwriter:[
    "A sharp hook written now saves an editor an hour later, so open with the line that stops the scroll.",
    "The story you shape today is what a creator gets to be proud of on camera.",
    "Great scripts start before you feel ready, so get the messy draft down and refine after.",
    "One clear idea carries a video further than ten clever ones, so find what it's really about.",
    "Write the version you'd actually want to watch and the audience usually agrees.",
  ],
  Editor:[
    "Momentum beats motivation, so open one video and the rest of the day follows.",
    "Start with the cut that scares you most and everything after it feels lighter.",
    "Your best edit this week is still ahead of you and it starts with the next one you open.",
    "A little progress before noon quietly turns into a finished video by evening.",
    "Someone on the other end is waiting to post this, so let's make it worth the wait.",
    "Done today beats perfect next week, and the creator feels the difference.",
  ],
};
function roleKey(r){r=r||"";return r.startsWith("Ops")?"Ops":r==="COO"?"COO":r==="Scriptwriter"?"Scriptwriter":"Editor";}
function setMotive(){const el=document.getElementById("motive");if(!el||!CURRENT)return;const arr=MOTIVES[roleKey(CURRENT.role)]||MOTIVES.Editor;const m=arr[Math.floor(Math.random()*arr.length)];el.innerHTML=`<div class="motive"><span class="spark">⚡</span><span class="mtext">${m}</span></div>`;}
// Optimistic moves that must survive a briefly-stale reload. After a status
// write, the server board can still be cached at the old status for a moment;
// we keep the card where the user put it until the server confirms the change,
// then let go. id -> statusRaw we set it to, or "__deleted__".
let SCW_MOVED={};
function applyMoved(){
  for(const id in SCW_MOVED){
    const want=SCW_MOVED[id];
    if(want==="__deleted__"){
      if(TASKS.find(x=>x.id===id)) TASKS=TASKS.filter(x=>x.id!==id); // still stale — keep hidden
      else delete SCW_MOVED[id];                                    // server caught up (gone)
      continue;
    }
    const t=TASKS.find(x=>x.id===id);
    if(!t){ delete SCW_MOVED[id]; continue; }
    if((t.statusRaw||"").trim().charAt(0)===String(want).trim().charAt(0)) delete SCW_MOVED[id]; // reconciled
    else { t.statusRaw=want; t.stage="Scripting"; }                                              // keep optimistic
  }
}
async function reload(){const d=await apiTasks(true);if(d){TASKS=(d.tasks||[]).filter(t=>t.stage!=="Archived");INTAKEX=d.intake||[];INTAKEALL=d.intakeAll||[];applyMoved();renderDash();}}
// Motion helpers — skeleton shimmer + count-up run only on the initial load
// (boot), so in-place refreshes after actions don't re-flash the numbers.
const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function skeletonHTML(){
  const t='<div class="sk sk-tile"></div>', card='<div class="sk sk-card"></div>';
  return `<div class="sk sk-greet"></div><div class="sk sk-sub"></div>
    <div class="sk-tiles">${t.repeat(6)}</div>
    <div class="sk-grid"><div>${card}</div><div>${card}</div></div>`;
}
function countUpAll(){
  if(REDUCED)return;
  document.querySelectorAll(".tile .n, .stagepill b").forEach(el=>{
    const m=el.textContent.trim().match(/^(\d+)(.*)$/); if(!m)return;
    const end=+m[1], suffix=m[2]||""; el.classList.add("num-anim");
    if(end===0)return;
    const dur=650, t0=performance.now();
    const step=now=>{const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);
      el.textContent=Math.round(end*e)+suffix; if(p<1)requestAnimationFrame(step);};
    el.textContent="0"+suffix; requestAnimationFrame(step);
  });
}
async function boot(){
  const d=await apiTasks();
  if(!d){document.getElementById("app").classList.add("hide");document.getElementById("gate").classList.remove("hide");inputs[0].focus();return;}
  CURRENT=d.user;TASKS=(d.tasks||[]).filter(t=>t.stage!=="Archived");INTAKEX=d.intake||[];INTAKEALL=d.intakeAll||[];
  document.getElementById("gate").classList.add("hide");document.getElementById("app").classList.remove("hide");
  document.getElementById("hName").textContent=(CURRENT.role.startsWith("Ops")||CURRENT.role.startsWith("Scriptwriter"))?"":CURRENT.name;document.getElementById("hRole").textContent=CURRENT.role;
  const a=document.getElementById("hAvatar");a.textContent=initials(CURRENT.name);a.style.background=colorFor(CURRENT.name);
  document.getElementById("today").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  setMotive();
  if(REDUCED){renderDash();return;}
  document.getElementById("dash").innerHTML=skeletonHTML();
  setTimeout(()=>{renderDash();countUpAll();},450);
}
// ===== render router =====
function renderDash(){const r=CURRENT.role;if(r==="COO")return cooView();if(r==="Ops")return opsView();if(r==="Scriptwriter")return scriptView();return editorView();}
const greet=s=>`<h2 class="greet">Hi ${CURRENT.name} 👋</h2><p class="greetsub">${s}</p>`;
// ===== COO =====
let COO_FILTER="all";
let COO_EXP_S=false, COO_EXP_L=false, COO_BOARD=false;
function setCooFilter(k){COO_FILTER=(COO_FILTER===k?"all":k);COO_EXP_S=false;COO_EXP_L=false;cooView();}
function cooMoreS(){COO_EXP_S=!COO_EXP_S;cooView();}
function cooMoreL(){COO_EXP_L=!COO_EXP_L;cooView();}
function cooBoardT(){COO_BOARD=!COO_BOARD;cooView();}
function cooView(){
  const dl=t=>{const d=t.postDate;if(!d)return 0;const x=Math.round((TODAY-new Date(d+"T00:00:00"))/864e5);return x>0?x:0;};
  const isBlockedUs=t=>t.waitingOn&&!["Client","Nobody"].includes(t.waitingOn);
  const stuck=TASKS.filter(t=>dueInfo(t).stuck),today=TASKS.filter(t=>dueInfo(t).today);
  const waitClient=TASKS.filter(t=>t.waitingOn==="Client"),editing=TASKS.filter(t=>t.stage==="Editing"),scripting=TASKS.filter(t=>t.stage==="Scripting");
  const over=EDITORS.filter(n=>loadFor(n)>CAP), overSet=new Set(over);
  // --- speed / trend / stale metrics (from real Notion timestamps) ---
  const AS=["Scripting","Ready to Edit","Editing","Review"];
  const bn=AS.map(s=>({s,n:TASKS.filter(t=>t.stage===s).length})).reduce((a,b)=>b.n>a.n?b:a,{s:"—",n:0});
  const wip=TASKS.filter(t=>ACTIVE.includes(t.stage)).length;
  const daysSince=iso=>{if(!iso)return 0;const x=Math.floor((TODAY-new Date(iso))/864e5);return x>0?x:0;};
  const pub=TASKS.filter(t=>t.stage==="Published"&&t.postDate);
  const weekOf=d=>Math.floor((TODAY-new Date(d+"T00:00:00"))/(7*864e5));
  const shippedW=w=>pub.filter(t=>weekOf(t.postDate)===w).length;
  const spark=[5,4,3,2,1,0].map(shippedW), smax=Math.max(...spark,1);
  const thisW=shippedW(0), lastW=shippedW(1), dW=thisW-lastW;
  const trend=dW>0?`<span class="up">▲${dW}</span>`:dW<0?`<span class="down">▼${-dW}</span>`:`<span class="flat">—</span>`;
  const sparkHtml=`<span class="sparkbars">${spark.map(v=>`<i style="height:${Math.round(v/smax*18)}px"></i>`).join("")}</span>`;
  const cycVals=INTAKEALL.map(t=>t.cycleHrs).filter(v=>typeof v==="number"&&v>0);
  const avgCyc=cycVals.length?Math.round(cycVals.reduce((a,b)=>a+b,0)/cycVals.length):0, slow=cycVals.filter(v=>v>72).length;
  const stale=TASKS.filter(t=>ACTIVE.includes(t.stage)&&daysSince(t.lastEdited)>=4).sort((a,b)=>daysSince(b.lastEdited)-daysSince(a.lastEdited));
  const pulse=`<div class="stagebar" style="margin-bottom:18px">
    <div class="stagepill" style="border-color:rgba(46,195,139,.4)"><b>${thisW}</b><span>✅ Shipped this week ${trend}</span>${sparkHtml}</div>
    <div class="stagepill" style="border-color:rgba(91,140,255,.4)"><b>${avgCyc?avgCyc+'h':'—'}</b><span>⚡ Avg cycle${slow?` · ${slow} slow`:''}</span></div>
    <div class="stagepill" style="border-color:rgba(255,152,56,.45)"><b>${bn.n}</b><span>⛔ Bottleneck · ${STAGEL[bn.s]||bn.s}</span></div>
    <div class="stagepill"><b>${wip}</b><span>🎬 In production</span></div></div>`;
  // --- pipeline funnel: count per stage, bottleneck flagged, click to drill in ---
  const funStages=[["Intake","🌱 New idea"],["Scripting","✍️ Scripting"],["Ready to Edit","🎬 Ready to edit"],["Editing","✂️ Editing"],["Review","👀 Review"],["Ready to Post","✅ Ready to post"]];
  // "Review" is the real review workload — the editor submissions in the "In
  // review & changes" panel (Video Intake), which is what clicking it opens — so
  // its count comes from INTAKEX, not the client-board Review stage. Every other
  // step counts board videos at that stage.
  const funnel=`<div class="funnel">${funStages.map(([s,l],i)=>{const n=(s==="Review"?INTAKEX.length:TASKS.filter(t=>t.stage===s).length),isB=(s===bn.s&&bn.n>0);return `<div class="fstep ${COO_FILTER===s?'active':''} ${isB?'bn':''}" onclick="setCooFilter('${s}')" title="Click to see these videos below"><div class="fn">${n}</div><div class="fl">${l}${isB?' ⛔':''}</div></div>${i<funStages.length-1?'<span class="farr">›</span>':''}`;}).join("")}</div>`;
  // Tiles = problems only. Stage filtering (editing / scripting / etc.) lives in
  // the pipeline funnel above, so those stage tiles were removed to avoid the
  // "clicking two different things does the same thing" overlap.
  const tiles=[
    {n:stuck.length,l:"📅 Late — not posted",c:stuck.length?"red":"green",f:"late"},
    {n:today.length,l:"🟠 Posting today",c:today.length?"amber":"green",f:"today"},
    {n:waitClient.length,l:"💬 Waiting on client",c:"blue",f:"client"},
    {n:over.length,l:"⚠️ Too much work",c:over.length?"red":"green",f:"over"},
  ];
  const tilesHtml=tiles.map(t=>`<div class="tile ${t.c} ${COO_FILTER===t.f?'active':''}" onclick="setCooFilter('${t.f}')"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join("");
  // --- one prioritized queue: board problems + intake review/changes ---
  const rankB=t=>{const d=dueInfo(t);if(d.stuck)return 0;if(d.today)return 1;if(isBlockedUs(t))return 2;if(d.overdue)return 2;if(t.waitingOn==="Client")return 3;return 99;};
  const badgeB=t=>{const d=dueInfo(t);
    if(d.stuck)return `<span class="badge red">late to post · ${dl(t)}d</span>`;
    if(d.today)return '<span class="badge amber">post today</span>';
    if(isBlockedUs(t))return `<span class="badge amber">blocked · ${t.waitingOn}</span>`;
    if(d.overdue)return `<span class="badge">late ${dl(t)}d</span>`;
    if(t.waitingOn==="Client")return '<span class="badge">on client</span>';
    return `<span class="badge">${STAGEL[t.stage]||t.stage}</span>`;};
  const preds={late:t=>dueInfo(t).stuck,today:t=>dueInfo(t).today,client:t=>t.waitingOn==="Client",editing:t=>t.stage==="Editing",scripting:t=>t.stage==="Scripting",over:t=>overSet.has(t.owner)&&ACTIVE.includes(t.stage)};
  ["Intake","Scripting","Ready to Edit","Editing","Review","Ready to Post"].forEach(s=>preds[s]=t=>t.stage===s);
  const boardRow=t=>`<div class="row"><span class="title">${t.title}</span><span class="clientchip">${t.client}</span>${badgeB(t)}${edSelect(t)}<button class="del" title="Remove from dashboard — kept in Notion" onclick="delVideo('${t.id}',this)">📥</button></div>`;

    <div class="tiles" style="grid-template-columns:repeat(4,1fr)">${tiles.map(t=>`<div class="tile ${t.c}"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join("")}</div>
    <div class="card" style="border-color:rgba(255,198,90,.4)"><h3><span class="ic"><span class="sq">🎬</span>To edit now</span><span class="sub">${toEdit.length} assigned to you</span></h3><div class="body"><div class="stack" style="padding:4px">${list(toEdit,editCard,"Nothing assigned to edit right now 🎉")}</div></div></div>
    <div class="card"><h3><span class="ic"><span class="sq">🗓️</span>Upcoming videos <span class="info" data-tip="Assigned to you but still being filmed or scripted. Get a head start on refs — don't edit yet.">i</span></span><span class="sub">${upcoming.length} coming your way</span></h3><div class="body"><div class="stack" style="padding:4px">${list(upcoming,ucard,"Nothing in the pipeline for you yet.")}</div></div></div>
    ${changes.length?`<div class="card" style="border-color:rgba(255,88,96,.45)"><h3><span class="ic"><span class="sq">⚠️</span>Needs changes</span><span class="sub">fix in your Discord thread, then reply "done"</span></h3><div class="body"><div class="stack" style="padding:4px">${list(changes,icard,"")}</div></div></div>`:""}
    <div class="card"><h3><span class="ic"><span class="sq">👀</span>In review</span><span class="sub">${inrev.length} submitted, waiting on review</span></h3><div class="body"><div class="stack" style="padding:4px">${list(inrev,icard,"Nothing in review right now.")}</div></div></div>`;
}
function colBox(title,items){
  const cards=items.length?items.map(t=>`<div class="kcard"><div class="kmeta"><span class="pri ${t.priority}">${PRI[t.priority]}</span><span class="eff">${t.effort}</span><span class="clientchip">${t.client}</span>${fmtBadge(t)}</div><div class="kt">${t.title}</div><div class="kmeta"><span class="who ${dueInfo(t).cls}">${dueInfo(t).label}</span>${t.waitingOn&&t.waitingOn!=="Nobody"?`<span class="wait">⏳ ${t.waitingOn}</span>`:""}</div></div>`).join(""):`<div class="empty" style="padding:18px">—</div>`;
  return `<div class="col"><h4>${title}<span class="cnt">${items.length}</span></h4><div class="stack">${cards}</div></div>`;
}
boot();
</script>
</body>
</html>
