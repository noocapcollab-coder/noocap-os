<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOOCAP Production OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070b; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.028);
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14);
    --txt:#f3f5fa; --muted:#9aa4b6; --faint:#646c7d;
    --p0:#ff5860; --p1:#ff9838; --p2:#5b93ff; --p3:#818b9c;
    --ok:#2fd39a; --warn:#ffc65a; --bad:#ff5860;
    --grad:linear-gradient(135deg,#5b8cff 0%,#8b5cff 55%,#2ec38b 130%);
    --shadow:0 2px 6px rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.5); --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(760px 460px at 82% -8%, rgba(91,140,255,.20), transparent 60%),
      radial-gradient(680px 420px at 8% 4%, rgba(139,92,255,.16), transparent 58%),
      radial-gradient(720px 560px at 60% 108%, rgba(46,195,139,.13), transparent 60%);}
  .wrap{max-width:1200px;margin:0 auto;padding:22px}.hide{display:none!important}
  #gate{min-height:100vh;display:grid;place-items:center;padding:26px 18px}
  .logincard{width:100%;max-width:390px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border:1px solid var(--line);border-radius:24px;padding:36px 30px;box-shadow:var(--shadow);text-align:center}
  .lock{width:60px;height:60px;border-radius:18px;margin:0 auto 20px;background:var(--grad);display:grid;place-items:center;font-size:26px;box-shadow:0 12px 34px rgba(91,140,255,.4)}
  .logincard h1{font-size:22px;margin:0 0 6px;letter-spacing:-.4px;font-weight:800}
  .logincard .sub{color:var(--muted);margin:0 0 26px;font-size:13.5px}
  .code{display:flex;gap:8px;justify-content:center}
  .code input{width:46px;height:56px;text-align:center;font-size:22px;font-weight:800;color:var(--txt);background:var(--glass2);border:1px solid var(--line);border-radius:13px;outline:none;transition:.15s;font-family:inherit}
  .code input:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.22);background:rgba(91,140,255,.06)}
  .err{color:var(--bad);font-size:12.5px;height:18px;margin:8px 0 0;opacity:0;transition:.2s}.err.show{opacity:1}
  .shake{animation:shake .38s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .hint{margin-top:22px;font-size:12px;color:var(--faint)}.hint b{color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  #hintList{margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.9;text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:6px 0 20px;margin-bottom:22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#fff;font-size:17px}
  .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.2px}.brand p{margin:0;color:var(--muted);font-size:12px}
  .whoami{display:flex;align-items:center;gap:11px}.whoami .meta{text-align:right}.whoami .meta .n{font-weight:700;font-size:13px}.whoami .meta .r{font-size:11.5px;color:var(--muted)}
  .switch{background:var(--glass);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:600;font-size:12.5px;font-family:inherit;transition:.15s}
  .switch:hover{color:var(--txt);border-color:var(--line2)}
  .greet{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
  .greetsub{color:var(--muted);margin:0 0 22px;font-size:13.5px;max-width:820px}
  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:22px}
  .tile{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .5s both}
  .tile::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--line2);opacity:.6}
  .tile.red::after{background:var(--bad)}.tile.amber::after{background:var(--warn)}.tile.blue::after{background:var(--p2)}.tile.green::after{background:var(--ok)}
  .tile .n{font-size:29px;font-weight:900;letter-spacing:-1.5px;line-height:1}
  .tile .l{font-size:12px;color:var(--muted);margin-top:6px}
  .tile.red .n{color:var(--bad)}.tile.amber .n{color:var(--warn)}.tile.green .n{color:var(--ok)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;animation:rise .5s both}
  .card h3{margin:0;padding:15px 17px;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:700}
  .card h3 .ic{display:flex;align-items:center;gap:10px}.card h3 .sq{width:26px;height:26px;border-radius:8px;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
  .card h3 .sub{color:var(--muted);font-weight:500;font-size:12px}.card .body{padding:8px 13px 13px}
  .empty{color:var(--faint);text-align:center;padding:24px 10px;font-size:13px}
  .row{display:flex;align-items:center;gap:11px;padding:11px 9px;border-radius:11px;transition:.12s}.row:hover{background:var(--glass2)}.row + .row{border-top:1px solid var(--line)}
  .pri{font-size:10px;font-weight:800;padding:4px 8px;border-radius:7px;letter-spacing:.4px;flex:0 0 auto}
  .P0{background:rgba(255,88,96,.16);color:#ff9297}.P1{background:rgba(255,152,56,.16);color:#ffbb7e}.P2{background:rgba(91,147,255,.16);color:#9dbcff}.P3{background:rgba(129,139,156,.2);color:#c2c9d5}
  .row .title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{color:var(--muted);font-size:12px;flex:0 0 auto}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--glass2);color:var(--muted);flex:0 0 auto;border:1px solid var(--line)}
  .badge.red{color:#ff9297;border-color:rgba(255,88,96,.42)}.badge.amber{color:#ffcf7a;border-color:rgba(255,198,90,.42)}
  .eff{font-size:10px;font-weight:800;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
  .clientchip{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(139,92,255,.14);color:#c7b3ff;border:1px solid rgba(139,92,255,.3);flex:0 0 auto}
  .cap{display:flex;align-items:center;gap:12px;padding:11px 8px}
  .cap .name{width:92px;font-weight:600;flex:0 0 auto;display:flex;align-items:center;gap:8px}
  .mini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#08090d;flex:0 0 auto}
  .cap .track{flex:1;height:20px;border-radius:10px;background:var(--glass2);overflow:hidden;border:1px solid var(--line)}
  .cap .fill{height:100%;border-radius:10px 0 0 10px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .cap .val{width:58px;text-align:right;color:var(--muted);font-size:12px;flex:0 0 auto;font-weight:600}
  .kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);gap:13px;overflow-x:auto;padding-bottom:12px}
  .kanban::-webkit-scrollbar{height:9px}.kanban::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  .col{background:var(--glass);border:1px solid var(--line);border-radius:15px;min-height:150px;animation:rise .5s both}
  .col h4{margin:0;padding:13px 14px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .col h4 .cnt{background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px}
  .col .stack{padding:11px;display:flex;flex-direction:column;gap:11px}
  .kcard{background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:12px;transition:.13s}.kcard:hover{border-color:var(--line2);transform:translateY(-1px)}
  .kcard .kt{font-weight:600;font-size:12.5px;margin:8px 0;line-height:1.35}
  .kcard .kmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.kcard .who{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:5px}
  .wait{font-size:10px;color:#ffcf7a}.od{color:#ff9297}.unassigned{outline:1px dashed rgba(255,198,90,.5)}
  .editor-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
  .colnote{font-size:10.5px;color:var(--faint);padding:0 14px 10px;margin-top:-2px}
  .note{color:var(--faint);font-size:12px;margin:15px 2px 0}
  .filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .flabel{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-right:2px;font-weight:800}
  .fchip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--glass2);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:.12s}
  .fchip:hover{border-color:var(--line2);color:var(--txt)}
  .fchip.on{background:rgba(91,140,255,.18);border-color:rgba(91,140,255,.55);color:#bcd0ff}
  .fsep{width:1px;height:20px;background:var(--line);margin:0 5px}
  .searchbox{flex:1;min-width:150px;display:flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:6px 13px}
  .searchbox input{background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:12.5px;width:100%}
  .stagebar{display:flex;flex-wrap:wrap;gap:9px}
  .stagepill{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
  .stagepill b{font-size:18px;font-weight:800;letter-spacing:-.5px}.stagepill span{color:var(--muted);font-size:12px}
  .morelink{color:#9dbcff;cursor:default;font-size:12px;font-weight:600;padding:10px 9px 4px}
  .agebadge{font-size:10px;color:#ff9297;font-weight:800;flex:0 0 auto}
  .plainbox{background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.3);border-radius:14px;padding:14px 17px;margin-bottom:18px;font-size:14.5px;color:var(--txt);line-height:1.6}
  .plainbox b{font-weight:800}
  .motive{display:flex;align-items:center;gap:12px;margin:2px 0 20px;padding:13px 16px;border-radius:14px;
    background:linear-gradient(120deg,rgba(91,140,255,.16),rgba(139,92,255,.14) 60%,rgba(46,195,139,.12));
    border:1px solid rgba(139,92,255,.32);animation:rise .5s both}
  .motive .spark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .motive .mtext{font-size:13.5px;font-weight:600;color:var(--txt);line-height:1.45}
  .keybox{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-top:18px;font-size:12.5px;color:var(--muted);line-height:2}
  .keybox b{color:var(--txt)}.keybox .k{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
  .info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:10px;font-weight:800;cursor:help;position:relative;flex:0 0 auto;font-style:italic;font-family:Georgia,serif}
  .info:hover{color:#fff;border-color:var(--accent);background:var(--accent)}
  .info:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);right:-6px;width:210px;background:#0c0f15;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font:500 11.5px/1.55 "Inter",sans-serif;color:var(--txt);box-shadow:var(--shadow);z-index:80;text-align:left;letter-spacing:0;text-transform:none}
  .info:hover::before{content:"";position:absolute;bottom:calc(100% + 4px);right:2px;border:5px solid transparent;border-top-color:var(--line2);z-index:80}
  .tileinfo{position:absolute;top:11px;right:12px}
  .assignbtn{background:rgba(46,195,139,.16);border:1px solid rgba(46,195,139,.42);color:#7fe6c0;border-radius:8px;padding:5px 11px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;flex:0 0 auto;transition:.12s}
  .assignbtn:hover{background:rgba(46,195,139,.3);color:#aef3d8}
  .esel{background:rgba(46,195,139,.14);border:1px solid rgba(46,195,139,.4);color:#aef3d8;border-radius:8px;padding:5px 9px;font-size:11px;font-family:inherit;font-weight:700;cursor:pointer;max-width:160px;outline:none}
  .esel:hover{background:rgba(46,195,139,.24)}.esel option{background:#11141b;color:var(--txt);font-weight:600}
  .asset{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--glass2);border:1px solid var(--line2);color:var(--muted);text-decoration:none}
  .asset:hover{color:var(--txt);border-color:var(--accent)}
  .act{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--glass2);border:1px solid var(--line2);color:var(--muted);cursor:pointer;font-family:inherit}
  .act.warn{border-color:rgba(255,120,120,.5);color:#ffb4b4}.act.warn:hover{background:rgba(255,90,90,.14)}
  .act.go{border-color:rgba(90,220,150,.5);color:#8fe9bd}.act.go:hover{background:rgba(70,220,150,.14)}
  .del{font-size:12px;padding:4px 8px;border-radius:8px;background:transparent;border:1px solid var(--line2);color:var(--faint);cursor:pointer;font-family:inherit;flex:0 0 auto;transition:.13s}
  .del:hover{color:#ff9297;border-color:rgba(255,88,96,.5);background:rgba(255,88,96,.1)}
  .fmt{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.3px;flex:0 0 auto}
  .fmt.lf{background:rgba(139,92,255,.16);color:#c7b3ff;border:1px solid rgba(139,92,255,.35)}
  .fmt.sf{background:rgba(56,200,214,.14);color:#8fe0ea;border:1px solid rgba(56,200,214,.32)}
  .sparkbars{display:inline-flex;align-items:flex-end;gap:2px;height:18px;margin-left:9px;vertical-align:-4px}
  .sparkbars i{width:4px;min-height:3px;background:rgba(46,195,139,.7);border-radius:1px}
  .up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}.flat{color:var(--faint);font-weight:800}
  .sc{padding:10px 8px;border-bottom:1px solid var(--line)}.sc:last-child{border-bottom:none}
  .sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .sc-top .name{display:flex;align-items:center;gap:8px;font-weight:600}
  .sc-load{font-size:12px;color:var(--muted);font-weight:700}.sc-load.od{color:#ff9297}
  .sc .track{height:8px;border-radius:6px;background:var(--glass2);overflow:hidden;border:1px solid var(--line)}
  .sc .fill{height:100%;border-radius:6px}
  .sc-meta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
  .sc-meta .bad{color:#ff9297;font-weight:700}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(18px);background:#11141b;border:1px solid var(--line2);color:var(--txt);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .chealth{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-bottom:18px}
  .ccard{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;transition:.13s}
  .ccard:hover{border-color:var(--line2);transform:translateY(-1px)}
  .ccard.bad{border-color:rgba(255,88,96,.45)}
  .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .cc-total{font-size:19px;font-weight:800;letter-spacing:-.5px}
  .cc-row{display:flex;gap:13px;font-size:11.5px;color:var(--muted)}
  .tile{overflow:visible}.tile::after{border-radius:var(--r) var(--r) 0 0}
  .card{overflow:visible}.card h3{border-radius:var(--r) var(--r) 0 0}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.editor-cols{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}

  /* ===== ANIMATION LAYER ===================================================
     1) drifting background blobs  2) hover/press micro-interactions
     3) staggered card + column motion  4) loading skeleton shimmer
     All disabled under prefers-reduced-motion (bottom of block).           */

  /* 1 — animated background: slow-drifting colour blobs behind everything */
  .bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bgfx span{position:absolute;border-radius:50%;filter:blur(80px);opacity:.34;will-change:transform}
  .bgfx span:nth-child(1){width:540px;height:540px;top:-150px;left:-90px;
    background:radial-gradient(circle,rgba(91,140,255,.55),transparent 70%);animation:drift1 30s ease-in-out infinite}
  .bgfx span:nth-child(2){width:480px;height:480px;top:14%;right:-120px;
    background:radial-gradient(circle,rgba(139,92,255,.5),transparent 70%);animation:drift2 34s ease-in-out infinite}
  .bgfx span:nth-child(3){width:600px;height:600px;bottom:-220px;left:38%;
    background:radial-gradient(circle,rgba(46,195,139,.4),transparent 70%);animation:drift3 40s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,40px) scale(1.08)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-60px) scale(1.14)}}

  /* 2 — micro-interactions: hover lift + press feedback */
  .tile{transition:transform .2s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .2s}
  .tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 12px 36px rgba(0,0,0,.5)}
  .tile[onclick]{cursor:pointer}
  .tile.active{border-color:rgba(91,140,255,.75)!important;box-shadow:0 0 0 2px rgba(91,140,255,.28),0 12px 36px rgba(0,0,0,.5)}
  .card{transition:border-color .2s,box-shadow .2s}
  .card:hover{border-color:var(--line2)}
  .stagepill{transition:transform .18s,border-color .18s}.stagepill:hover{transform:translateY(-2px);border-color:var(--line2)}
  .switch,.assignbtn,.esel,.asset,.act,.fchip{transition:transform .13s,background .15s,border-color .15s,color .15s}
  .switch:active,.assignbtn:active,.esel:active,.asset:active,.act:active,.fchip:active,.ccard:active,.tile:active{transform:scale(.96)}
  .num-anim{font-variant-numeric:tabular-nums}

  /* 3 — staggered entrance for columns, cards, capacity bars */
  .kanban .col,.editor-cols .col{animation:rise .5s both}
  .kanban .col:nth-child(2),.editor-cols .col:nth-child(2){animation-delay:.06s}
  .kanban .col:nth-child(3),.editor-cols .col:nth-child(3){animation-delay:.12s}
  .kanban .col:nth-child(4),.editor-cols .col:nth-child(4){animation-delay:.18s}
  .kanban .col:nth-child(5),.editor-cols .col:nth-child(5){animation-delay:.24s}
  .kanban .col:nth-child(6){animation-delay:.3s}
  .grid2>div:nth-child(2) .card{animation-delay:.1s}
  .cap{animation:rise .45s both}

const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function skeletonHTML(){

}
function enterDash(){

}
function countUpAll(){
  if(REDUCED)return;
  document.querySelectorAll(".tile .n, .stagepill b").forEach(el=>{
    const raw=el.textContent.trim(), m=raw.match(/^(\d+)(.*)$/);
    if(!m)return; const end=+m[1], suffix=m[2]||"";
    if(end===0){el.classList.add("num-anim");return;}
    el.classList.add("num-anim"); const dur=650, t0=performance.now();
    const step=now=>{const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);
      el.textContent=Math.round(end*e)+suffix; if(p<1)requestAnimationFrame(step);};
    el.textContent="0"+suffix; requestAnimationFrame(step);
  });
}
const greet=(s)=>`<h2 class="greet">Good morning, ${CURRENT.name} 👋</h2><p class="greetsub">${s}</p>`;

function cooView(){
  const dl=t=>{if(!t.post)return 0;const x=Math.round((TODAY-new Date(t.post+"T00:00:00"))/864e5);return x>0?x:0;};

    <div class="stagepill" style="border-color:rgba(91,140,255,.4)"><b>${avgCyc}h</b><span>⚡ Avg cycle${slow?` · ${slow} slow`:''}</span></div>
    <div class="stagepill" style="border-color:rgba(255,152,56,.45)"><b>${bn.n}</b><span>⛔ Bottleneck · ${STAGEL[bn.s]||bn.s}</span></div>
    <div class="stagepill"><b>${wip}</b><span>🎬 In production</span></div></div>`;
  // --- tiles double as filters for the queue below ---

    {n:stuck.length,l:"📅 Ready, past date",c:stuck.length?"red":"green",f:"late"},

    {n:scripting.length,l:"✍️ In scripting",c:"",f:"scripting"},

  // --- one prioritized queue, worst first ---
  const rankOf=t=>{const d=dueInfo(t);if(d.stuck)return 0;if(t.stage==="Changes")return 1;if(d.today)return 1;if(t.stage==="Review")return 2;if(isBlockedUs(t))return 2;if(d.overdue)return 2;if(t.wait==="Client")return 3;return 99;};

  const preds={late:t=>dueInfo(t).stuck,today:t=>dueInfo(t).today,client:t=>t.wait==="Client",editing:t=>t.stage==="Editing",scripting:t=>t.stage==="Scripting",over:t=>overSet.has(t.owner)&&ACTIVE.includes(t.stage)};

      <div class="card"><h3><span class="ic"><span class="sq">📌</span>Chase &amp; unblock <span class="info" data-tip="Videos stuck waiting on someone, oldest first. Nudge the ones at the top.">i</span></span><span class="sub">oldest first · ${chase.length}</span></h3><div class="body">${chaseList}</div></div>
    </div><div>
      <div class="card"><h3><span class="ic"><span class="sq">📊</span>Editor capacity <span class="info" data-tip="How full each editor is. Green means room to spare, red means overloaded.">i</span></span><span class="sub">across all clients</span></h3><div class="body">${cap}<p class="colnote" style="padding:9px 8px 2px">⚖️ ${hint}</p></div></div>
    </div></div>
    ${reviewPanel()}
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px">
      <span style="font-size:13px;font-weight:700;color:var(--muted)">🗂️ Board <span class="info" data-tip="Every video grouped by the stage it's in. Click expand to see the actual cards.">i</span>${flabel}</span>
      <button class="switch" onclick="toggleBoard()">${OPS_BOARD?"Collapse board":"Expand full board"}</button></div>
    ${board}
    ${key}`;
}
function kcol(title,items){
  const kts=t=>t.post?new Date(t.post+"T00:00:00").getTime():Infinity;
  const cards=items.length?items.sort((a,b)=>kts(a)-kts(b)).map(t=>{const d=dueInfo(t);
    return `<div class="kcard ${!t.owner?'unassigned':''}"><div class="kmeta"><span class="eff">${t.eff}</span>
      <span class="clientchip">${t.client}</span>${fmtBadge(t)}</div><div class="kt">${t.t}</div>
      <div class="kmeta"><span class="who">${t.owner?mini(t.owner,18)+t.owner:'⚠ unassigned'}</span><span class="who ${d.cls}">${d.label}</span>${t.wait?`<span class="wait">⏳ ${t.wait}</span>`:''}</div>
      <div style="margin-top:9px;display:flex;gap:6px;align-items:center">${edSelect(t,t.owner?"Move ▾":"Assign ▾")}<button class="del" title="Remove from dashboard — kept in Notion" onclick="delVideo('${t.id}')">📥</button></div></div>`;}).join("")
    :`<div class="empty" style="padding:16px">—</div>`;
  return `<div class="col"><h4>${STAGEL[title]||title}<span class="cnt">${items.length}</span></h4><div class="stack">${cards}</div></div>`;
}
// ===== SCRIPTWRITER =====
function scriptView(){
  const q=TASKS.filter(t=>["Intake","Scripting"].includes(t.stage));
  const cols=[{k:"To script",f:t=>t.stage==="Scripting",note:"in progress"},{k:"Incoming",f:t=>t.stage==="Intake",note:"needs a brief"},{k:"Waiting approval",f:t=>t.wait==="Client",note:"with creator/brand"}];
  const tiles=[{n:q.filter(t=>t.stage==="Scripting").length,l:"✍️ Scripting",c:"blue"},{n:q.filter(t=>t.stage==="Intake").length,l:"📥 Incoming",c:"amber"},{n:TASKS.filter(t=>t.type==="Long-form"&&ACTIVE.includes(t.stage)).length,l:"🎬 Long-form",c:""}];
  document.getElementById("dash").innerHTML=`
    <h2 class="greet">Good morning 👋</h2><p class="greetsub">Your scripting queue across clients. Done = strong hook, clear structure, claims checked, CTA, references.</p>
    <div class="tiles" style="grid-template-columns:repeat(3,1fr)">${stag(tiles.map(t=>`<div class="tile ${t.c}"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`))}</div>
    <div class="editor-cols" style="grid-template-columns:repeat(3,1fr)">${cols.map(c=>colBox(c.k,TASKS.filter(c.f),c.note)).join("")}</div>
    <p class="note">Flag a thin brief as <b>Blocked → waiting on Ops</b> rather than guessing.</p>`;
}
// ===== EDITOR =====
function editorView(name){
  const mine=TASKS.filter(t=>t.owner===name);
  // To edit = assigned work from the creator boards. Rest = status from Intake.
  // Editors triage by when it's due, not an abstract priority (the creator
  // boards don't carry a Priority field anyway). Soonest post date first.
  const ts=t=>t.post?new Date(t.post+"T00:00:00").getTime():Infinity;
  // Actively editable = on their desk now. Upcoming = assigned to them but still
  // upstream (being filmed or scripted) — prep, don't edit yet.
  const toEdit=mine.filter(t=>t.stage==="Editing").sort((a,b)=>ts(a)-ts(b));
  const upcoming=mine.filter(t=>["Ready to Edit","Scripting","Intake"].includes(t.stage)).sort((a,b)=>ts(a)-ts(b));
  const inrev=mine.filter(t=>t.stage==="Review");
  const changes=mine.filter(t=>t.stage==="Changes");
  const topost=mine.filter(t=>t.stage==="Ready to Post");
  const posted=mine.filter(t=>t.stage==="Published");
  const tiles=[
    {n:toEdit.length,l:"🎬 To edit now",c:toEdit.length?"amber":"green"},
    {n:upcoming.length,l:"🗓️ Upcoming",c:""},
    {n:inrev.length,l:"👀 In review",c:"blue"},
    {n:changes.length,l:"⚠️ Needs changes",c:changes.length?"red":"green"},
  ];
  const editCard=t=>`<div class="kcard"><div class="kmeta"><span class="eff">${t.eff}</span><span class="clientchip">${t.client}</span>${fmtBadge(t)}${fmtBadge(t)}</div><div class="kt" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${t.t}</span><button class="assignbtn" style="flex:0 0 auto" onclick="submitForm('${t.id}')">✍ Submit form</button></div><div class="kmeta"><span class="who ${dueInfo(t).cls}">${dueInfo(t).label}</span>${t.wait&&t.wait!=="Nobody"?`<span class="wait">⏳ ${t.wait}</span>`:""}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px"><a class="asset" href="#" onclick="return false">🎬 Footage</a><a class="asset" href="#" onclick="return false">📄 Script</a><a class="asset" href="#" onclick="return false">📋 Refs</a></div></div>`;
  const icard=t=>`<div class="kcard"><div class="kmeta"><span class="clientchip">${t.client||"—"}</span>${t.post?`<span class="who">${dueInfo(t).label}</span>`:""}</div><div class="kt">${t.t}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><a class="asset" href="#" onclick="return false">▶ Frame.io</a><a class="asset" href="${threadUrl(t)}" target="_blank" rel="noopener">💬 Open thread</a></div></div>`;
  const ucard=t=>`<div class="kcard"><div class="kmeta"><span class="clientchip">${t.client||"—"}</span><span class="eff">${t.eff}</span><span class="badge">${STAGEL[t.stage]||t.stage}</span></div><div class="kt">${t.t}</div><div class="kmeta"><span class="who ${dueInfo(t).cls}">${dueInfo(t).label}</span>${t.wait&&t.wait!=="Nobody"?`<span class="wait">⏳ ${t.wait}</span>`:""}</div></div>`;
  const list=(arr,fn,empty)=>arr.length?arr.map(fn).join(""):`<div class="empty" style="padding:16px">${empty}</div>`;
  const col=(title,arr,note,empty)=>`<div class="col"><h4>${title}<span class="cnt">${arr.length}</span></h4><div class="colnote">${note}</div><div class="stack">${list(arr,icard,empty)}</div></div>`;
  document.getElementById("dash").innerHTML=`
    ${greet("What you need to edit now, and where your submitted videos stand.")}
    <div class="tiles" style="grid-template-columns:repeat(4,1fr)">${tiles.map(t=>`<div class="tile ${t.c}"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join("")}</div>
    <div class="card" style="border-color:rgba(255,198,90,.4)"><h3><span class="ic"><span class="sq">🎬</span>To edit now</span><span class="sub">${toEdit.length} assigned to you</span></h3><div class="body"><div class="stack" style="padding:4px">${list(toEdit,editCard,"Nothing assigned to edit right now 🎉")}</div></div></div>
    <div class="card"><h3><span class="ic"><span class="sq">🗓️</span>Upcoming videos <span class="info" data-tip="Assigned to you but still being filmed or scripted. Get a head start on refs — don't edit yet.">i</span></span><span class="sub">${upcoming.length} coming your way</span></h3><div class="body"><div class="stack" style="padding:4px">${list(upcoming,ucard,"Nothing in the pipeline for you yet.")}</div></div></div>
    ${changes.length?`<div class="card" style="border-color:rgba(255,88,96,.45)"><h3><span class="ic"><span class="sq">⚠️</span>Needs changes</span><span class="sub">fix in your Discord thread, then reply "done"</span></h3><div class="body"><div class="stack" style="padding:4px">${list(changes,icard,"")}</div></div></div>`:""}
    <div class="card"><h3><span class="ic"><span class="sq">👀</span>In review</span><span class="sub">${inrev.length} submitted, waiting on review</span></h3><div class="body"><div class="stack" style="padding:4px">${list(inrev,icard,"Nothing in review right now.")}</div></div></div>`;
}
function colBox(title,items,note){
  const cards=items.length?items.map(t=>{const d=dueInfo(t);
    return `<div class="kcard"><div class="kmeta"><span class="pri ${t.pri}">${PRI[t.pri]}</span><span class="eff">${t.eff}</span><span class="clientchip">${t.client}</span>${fmtBadge(t)}${fmtBadge(t)}</div>
      <div class="kt">${t.t}</div><div class="kmeta"><span class="who ${d.cls}">${d.label}</span>${t.wait?`<span class="wait">⏳ ${t.wait}</span>`:''}</div></div>`;}).join("")
    :`<div class="empty" style="padding:18px">—</div>`;
  return `<div class="col"><h4>${title}<span class="cnt">${items.length}</span></h4><div class="colnote">${note}</div><div class="stack">${cards}</div></div>`;
}
inputs[0].focus();
</script>
</body>
